name: Daily Data Ingestion

on:
  schedule:
    # 4:00 AM UTC is 9:30 AM IST
    - cron: '0 4 * * *'
  workflow_dispatch: # Allow manual triggers

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Ingestion Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/scraper.py
          python src/cleaner.py
          python src/chunker.py
          python src/vector_store.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # Only commit if there are changes in the data directory
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily data ingestion update" && git push)
